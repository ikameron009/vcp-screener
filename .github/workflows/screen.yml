name: VCP screen
# theme-flowのCloudflare Worker(cron_worker/)が workflow_dispatch で時刻どおり起動する。run-nameの[市場]で見張り/予備判定が識別する
run-name: ${{ github.event_name == 'workflow_dispatch' && format('VCP screen [{0}]', inputs.market) || 'VCP screen (backup cron)' }}

on:
  schedule:
    # 2段階: 08:00 UTC = 17:00 JST → 日本株(当日の大引け後。翌3:00だとYahooの前日分が未反映)。
    #        22:00 UTC = 翌07:00 JST → 米国株(米引け後で確定)。UTC月-金 = JST火-土(金曜の結果は土曜朝)。
    - cron: '0 8 * * 1-5'   # 17:00 JST 日本株(当日の大引け後)
    - cron: '0 22 * * 1-5'   # 07:00 JST 米国株
  workflow_dispatch:
    inputs:
      market:
        description: 'jp / us / both'
        default: 'both'

concurrency:
  group: vcp-screen
  cancel-in-progress: false

jobs:
  # ---- 予備cronの判定: Workerの起動分が済んでいれば(成功 or 実行中)何もしない ----
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ github.event.schedule }}" = "0 8 * * 1-5" ]; then M=jp; else M=us; fi
          SINCE=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          N=$(gh run list -R "${{ github.repository }}" --workflow screen.yml --event workflow_dispatch --created ">=$SINCE" --limit 20 --json displayTitle,status,conclusion --jq "[.[] | select((.displayTitle|contains(\"[$M]\")) or (.displayTitle|contains(\"[both]\"))) | select(.conclusion==\"success\" or .status!=\"completed\")] | length") || N=0
          echo "market=$M 済み件数=$N"
          if [ "$N" -gt 0 ]; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi

  screen:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    # 履歴を自リポへpushするため書き込み権限が必要(repo既定はread=以前はpushが毎回失敗し履歴が消えていた)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Decide market
        id: mkt
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 8 * * 1-5" ]; then M=jp; else M=us; fi
          else
            M="${{ github.event.inputs.market }}"; [ -z "$M" ] && M=both
          fi
          echo "market=$M" >> "$GITHUB_OUTPUT"
          echo "MARKET=$M"

      # ---- 米国株(7:00 JST / both) ----
      - name: US screen + export
        if: steps.mkt.outputs.market == 'us' || steps.mkt.outputs.market == 'both'
        run: |
          python minervini_screener.py --universe nyse_nasdaq --rs-min 70 --growth --deepvue --out us_today || echo "US screen degraded"
          python export_vcp_json.py --market US --csv us_today.csv --out vcp_us_history.json || echo "US export failed"

      # ---- 日本株(17:00 JST / both) 当日の大引け後 ----
      - name: JP screen + export
        if: steps.mkt.outputs.market == 'jp' || steps.mkt.outputs.market == 'both'
        env:
          EDINETDB_API_KEY: ${{ secrets.EDINETDB_API_KEY }}
        run: |
          python build_jp_universe.py || echo "jp universe failed"
          python minervini_screener.py --universe jp_universe.txt --rs-min 70 --deepvue --dv-dvol 1e9 --dv-ret3m 0.25 --out jp_today || echo "JP screen degraded"
          if [ -n "${EDINETDB_API_KEY}" ]; then
            python jp_growth.py --csv jp_today.csv --min-rev 15 --min-eps 15 || echo "jp growth failed"
          else
            echo "EDINETDB_API_KEY 未設定 → 成長フィルタskip"
          fi
          python export_vcp_json.py --market JP --csv jp_today.csv --out vcp_jp_history.json || echo "JP export failed"

      # ---- 履歴を自リポにコミット(自市場のファイルだけ・rebaseで競合回避) ----
      - name: Persist history
        run: |
          git config user.name "vcp-bot"
          git config user.email "vcp-bot@users.noreply.github.com"
          M="${{ steps.mkt.outputs.market }}"
          if [ "$M" = "jp" ] || [ "$M" = "both" ]; then git add vcp_jp_history.json; fi
          if [ "$M" = "us" ] || [ "$M" = "both" ]; then git add vcp_us_history.json; fi
          git commit -m "history $M $(date -u +%F)" || { echo "no history change"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "history push retry $i"; sleep 10
          done
          echo "::error::履歴のpushに失敗(履歴が消える原因)"; echo "HISTORY_FAIL=1" >> "$GITHUB_ENV"

      # ---- 結果JSONを公開リポ theme-flow へ(★自市場のファイルだけ上書き・逆戻り防止) ----
      - name: Publish JSON to theme-flow
        env:
          TF_TOKEN: ${{ secrets.THEMEFLOW_TOKEN }}
        run: |
          if [ -z "${TF_TOKEN}" ]; then echo "THEMEFLOW_TOKEN 未設定 → 公開反映スキップ"; exit 0; fi
          M="${{ steps.mkt.outputs.market }}"
          git clone "https://x-access-token:${TF_TOKEN}@github.com/ikameron009/theme-flow.git" tf
          if [ "$M" = "jp" ] || [ "$M" = "both" ]; then cp vcp_jp_history.json tf/vcp_jp.json; fi
          if [ "$M" = "us" ] || [ "$M" = "both" ]; then cp vcp_us_history.json tf/vcp_us.json; fi
          cd tf
          git config user.name "vcp-bot"
          git config user.email "vcp-bot@users.noreply.github.com"
          git add vcp_us.json vcp_jp.json
          git commit -m "VCP screener update ($M) $(date -u +%F)" || { echo "no change"; exit 0; }
          git push || (git pull --rebase origin main && git push)

      # 公開は済ませたうえで、履歴保存に失敗していたらランを失敗扱いにする(見張りが検知・再実行)
      - name: Fail if history was not saved
        if: env.HISTORY_FAIL == '1'
        run: exit 1

      # 価格データが本来の最新取引日より古い(Yahooの反映待ち等)回は失敗扱い → Workerの見張りが再実行・通知
      - name: Fail if price data is stale
        if: always()
        run: |
          python -c "import json,glob,sys; bad=[s for s in (json.load(open(f)) for f in glob.glob('vcp_status_*.json')) if not s.get('ok')]; [print('::error::データの取りこぼし', b) for b in bad]; sys.exit(1 if bad else 0)"
